services:
  # PHP-FPM Service
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ci4_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./writable:/var/www/html/writable
    networks:
      - ci4_network
    environment:
      - CI_ENVIRONMENT=development
      - APP_BASEURL=http://localhost
      - DB_HOST=db
      - DB_PORT=${DB_PORT:-3306}
      - DB_NAME=${DB_NAME:-ci4}
      - DB_USERNAME=${DB_USERNAME:-ci4_user}
      - DB_PASSWORD=${DB_PASSWORD:-password}
    depends_on:
      - db

  # MySQL Database Service
  db:
    image: mysql:8.0
    container_name: ci4_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-ci4}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-ci4_user}
      MYSQL_ALLOW_EMPTY_PASSWORD: 'false'
    ports:
      - '${DB_PORT:-3306}:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - ci4_network
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      timeout: 20s
      retries: 10

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: ci4_nginx
    restart: unless-stopped
    ports:
      - '${APP_PORT:-80}:80'
    volumes:
      - ./:/var/www/html
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf
    networks:
      - ci4_network
    depends_on:
      - app
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://localhost/ || exit 1']
      timeout: 10s
      retries: 3

  # Node.js for Tailwind CSS (Optional - for development)
  node:
    image: node:latest
    container_name: ci4_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: npm run watch:css
    networks:
      - ci4_network
    depends_on:
      - app

networks:
  ci4_network:
    driver: bridge

volumes:
  db_data:
    driver: local
